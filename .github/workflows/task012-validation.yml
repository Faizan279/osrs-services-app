name: Task 012 validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/task-012-product-marketplace
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "3306"
  DATABASE_USER: osrs
  DATABASE_PASSWORD: task012-app-password
  DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
  AUTH_SECRET: task012-ci-auth-secret-at-least-32-characters
  ELIGIBILITY_HMAC_SECRET: task012-ci-eligibility-secret-at-least-32-characters
  ADMIN_SEED_EMAIL: task012-admin@example.test
  ADMIN_SEED_PASSWORD: Task012-CI-Admin-Password-Only
  ADMIN_SEED_NAME: Task 012 CI Admin
  ADMIN_SEED_RESET_PASSWORD: "false"
  CUSTOM_BUILD_PRIVATE_ATTACHMENT_ROOT: /tmp/osrs-services-task012-private
  RSN_DEVELOPMENT_FIXTURE: "true"
  CI: "true"

jobs:
  task012-validation:
    name: task012-validation
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DATABASE_NAME: osrs_services
      DATABASE_URL: mysql://osrs:task012-app-password@127.0.0.1:3306/osrs_services
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: task012-root-password
          MYSQL_DATABASE: osrs_services
          MYSQL_USER: osrs
          MYSQL_PASSWORD: task012-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uosrs -ptask012-app-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prisma format
        run: pnpm exec prisma format

      - name: Verify Prisma format did not change tracked files
        run: git diff --exit-code

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply fresh migrations
        run: pnpm db:migrate

      - name: Seed fresh database
        run: pnpm db:seed

      - name: Write fresh database validation report
        run: pnpm exec tsx scripts/validate-task012-fresh-db.ts

      - name: Validate inventory transactions and reservation concurrency
        run: pnpm exec tsx scripts/validate-task012-transactions.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Seed tests
        run: pnpm test:seed

      - name: Format check
        run: pnpm format:check

      - name: Build
        env:
          RSN_DEVELOPMENT_FIXTURE: "false"
        run: pnpm build

      - name: E2E tests
        env:
          PLAYWRIGHT_USE_DEV_SERVER: "true"
          RSN_DEVELOPMENT_FIXTURE: "true"
        run: pnpm test:e2e

      - name: Capture Task 012 screenshots
        env:
          RSN_DEVELOPMENT_FIXTURE: "false"
        run: |
          pnpm build
          pnpm start > next-task012-screenshots.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat next-task012-screenshots.log
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          pnpm screenshots:task012

      - name: Verify Task 012 screenshots
        run: pnpm exec tsx scripts/build-task012-review-pack.ts --verify-screenshots

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task012-playwright-results
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task012-screenshots
          path: artifacts/task-012/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload fresh validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task012-fresh-validation-report
          path: |
            artifacts/task-012/task012-fresh-database-validation.txt
            artifacts/task-012/task012-inventory-reservation-validation.txt
          if-no-files-found: ignore
          retention-days: 14

  task011-to-task012-upgrade:
    name: task011-to-task012-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_NAME: task012_existing_validation
      DATABASE_URL: mysql://osrs:task012-app-password@127.0.0.1:3306/task012_existing_validation
      TASK011_BASE_COMMIT: d24adb9a3fc57befc9676b6a2357c9e578408466
      TASK012_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: task012-root-password
          MYSQL_DATABASE: task012_existing_validation
          MYSQL_USER: osrs
          MYSQL_PASSWORD: task012-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uosrs -ptask012-app-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout Task 012 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Check out Task 011 merge commit
        run: |
          git checkout "$TASK011_BASE_COMMIT"
          git show "$TASK012_HEAD_SHA:scripts/validate-task012-existing-db.ts" > scripts/validate-task012-existing-db.ts

      - name: Install Task 011 dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Task 011 Prisma client
        run: pnpm db:generate

      - name: Apply Task 001-011 migrations
        run: pnpm db:migrate

      - name: Seed Task 011 database
        run: pnpm db:seed

      - name: Snapshot Task 011 preservation markers
        run: pnpm exec tsx scripts/validate-task012-existing-db.ts snapshot

      - name: Check out Task 012 branch
        run: |
          rm -f scripts/validate-task012-existing-db.ts
          git checkout "$TASK012_HEAD_SHA"

      - name: Install Task 012 dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Task 012 Prisma client
        run: pnpm db:generate

      - name: Apply Task 012 migration
        run: pnpm db:migrate

      - name: Seed Task 012 database once
        run: pnpm db:seed

      - name: Create product seed-preservation markers
        run: pnpm exec tsx scripts/validate-task012-existing-db.ts prepare-product

      - name: Seed Task 012 database a second time
        run: pnpm db:seed

      - name: Verify Task 011 preservation and Task 012 additions
        run: pnpm exec tsx scripts/validate-task012-existing-db.ts verify

      - name: Upload upgrade validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task012-upgrade-validation-report
          path: artifacts/task-012/task011-to-task012-validation.txt
          if-no-files-found: ignore
          retention-days: 14

  task012-final-review-pack:
    name: task012-final-review-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - task012-validation
      - task011-to-task012-upgrade
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changed file manifest
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD > changed-files.txt

      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: task012-screenshots
          path: artifacts/task-012

      - name: Download fresh validation report
        uses: actions/download-artifact@v4
        with:
          name: task012-fresh-validation-report
          path: artifacts/task-012

      - name: Download upgrade validation report
        uses: actions/download-artifact@v4
        with:
          name: task012-upgrade-validation-report
          path: artifacts/task-012

      - name: Build final review pack
        run: pnpm exec tsx scripts/build-task012-review-pack.ts

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task012-validation-reports
          path: |
            artifacts/task-012/*.txt
            reports/CODEX-TASK-012-COMPLETION.md
            task-012-review-summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload final review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task012-final-review-pack
          path: task-012-final-review-pack.zip
          if-no-files-found: error
          retention-days: 14
