name: Task 014 validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/task-014-customer-accounts-dashboard
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "3306"
  DATABASE_USER: osrs
  DATABASE_PASSWORD: task014-app-password
  DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
  AUTH_SECRET: task014-ci-auth-secret-at-least-32-characters
  ELIGIBILITY_HMAC_SECRET: task014-ci-eligibility-secret-at-least-32-characters
  ADMIN_SEED_EMAIL: task014-admin@example.test
  ADMIN_SEED_PASSWORD: Task014-CI-Admin-Password-Only
  ADMIN_SEED_NAME: Task 014 CI Admin
  ADMIN_SEED_RESET_PASSWORD: "false"
  TASK014_CUSTOMER_TEST_PASSWORD: Task014-CI-Customer-Password-Only
  CUSTOMER_SESSION_COOKIE: osrs_customer_session
  CUSTOM_BUILD_PRIVATE_ATTACHMENT_ROOT: /tmp/osrs-services-task014-private
  RSN_DEVELOPMENT_FIXTURE: "true"
  CI: "true"

jobs:
  task014-validation:
    name: task014-validation
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DATABASE_NAME: osrs_services
      DATABASE_URL: mysql://osrs:task014-app-password@127.0.0.1:3306/osrs_services
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: task014-root-password
          MYSQL_DATABASE: osrs_services
          MYSQL_USER: osrs
          MYSQL_PASSWORD: task014-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uosrs -ptask014-app-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prisma format
        run: pnpm exec prisma format

      - name: Verify Prisma format did not change tracked files
        run: git diff --exit-code

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply fresh migrations
        run: pnpm db:migrate

      - name: Seed fresh database
        run: pnpm db:seed

      - name: Write fresh database validation report
        run: pnpm exec tsx scripts/validate-task014-fresh-db.ts

      - name: Validate customer authentication transactions
        run: pnpm exec tsx scripts/validate-task014-auth.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Seed tests
        run: pnpm test:seed

      - name: Format check
        run: pnpm format:check

      - name: Build
        env:
          RSN_DEVELOPMENT_FIXTURE: "false"
        run: pnpm build

      - name: E2E tests
        env:
          PLAYWRIGHT_USE_DEV_SERVER: "true"
          RSN_DEVELOPMENT_FIXTURE: "true"
        run: pnpm test:e2e

      - name: Capture Task 014 screenshots
        env:
          RSN_DEVELOPMENT_FIXTURE: "false"
        run: |
          pnpm build
          pnpm start > next-task014-screenshots.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat next-task014-screenshots.log
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          pnpm screenshots:task014

      - name: Verify Task 014 screenshots
        run: pnpm exec tsx scripts/build-task014-review-pack.ts --verify-screenshots

      - name: Privacy, token and credential scans
        run: pnpm exec tsx scripts/build-task014-review-pack.ts --scan-sources

      - name: Git whitespace check
        run: git diff --check

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task014-playwright-results
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task014-screenshots
          path: artifacts/task-014/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload fresh validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task014-fresh-validation-report
          path: artifacts/task-014/task014-fresh-database-validation.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload customer-auth validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task014-auth-validation-report
          path: artifacts/task-014/task014-customer-auth-validation.txt
          if-no-files-found: ignore
          retention-days: 14

  task013-to-task014-upgrade:
    name: task013-to-task014-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_NAME: task014_existing_validation
      DATABASE_URL: mysql://osrs:task014-app-password@127.0.0.1:3306/task014_existing_validation
      TASK013_BASE_COMMIT: 31b8b761b3f89dba75f379ba12a6d8b6fece4b8b
      TASK014_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: task014-root-password
          MYSQL_DATABASE: task014_existing_validation
          MYSQL_USER: osrs
          MYSQL_PASSWORD: task014-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uosrs -ptask014-app-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout Task 014 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Check out Task 013 merge commit
        run: |
          git checkout "$TASK013_BASE_COMMIT"
          git show "$TASK014_HEAD_SHA:scripts/validate-task014-existing-db.ts" > scripts/validate-task014-existing-db.ts

      - name: Install Task 013 dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Task 013 Prisma client
        run: pnpm db:generate

      - name: Apply Task 001-013 migrations
        run: pnpm db:migrate

      - name: Seed Task 013 database
        run: pnpm db:seed

      - name: Snapshot Task 013 preservation markers
        run: pnpm exec tsx scripts/validate-task014-existing-db.ts snapshot

      - name: Check out Task 014 branch
        run: |
          rm -f scripts/validate-task014-existing-db.ts
          git checkout "$TASK014_HEAD_SHA"

      - name: Install Task 014 dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Task 014 Prisma client
        run: pnpm db:generate

      - name: Apply Task 014 migration
        run: pnpm db:migrate

      - name: Seed Task 014 database
        run: pnpm db:seed

      - name: Prepare deterministic Task 014 preservation fixtures
        run: pnpm exec tsx scripts/validate-task014-existing-db.ts prepare-customer

      - name: Rerun Task 014 seed
        run: pnpm db:seed

      - name: Verify Task 013 preservation and Task 014 additions
        run: pnpm exec tsx scripts/validate-task014-existing-db.ts verify

      - name: Upload upgrade validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task014-upgrade-validation-report
          path: artifacts/task-014/task013-to-task014-validation.txt
          if-no-files-found: ignore
          retention-days: 14

  task014-final-review-pack:
    name: task014-final-review-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - task014-validation
      - task013-to-task014-upgrade
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changed file manifest
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD > changed-files.txt

      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: task014-screenshots
          path: artifacts/task-014

      - name: Download fresh validation report
        uses: actions/download-artifact@v4
        with:
          name: task014-fresh-validation-report
          path: artifacts/task-014

      - name: Download auth validation report
        uses: actions/download-artifact@v4
        with:
          name: task014-auth-validation-report
          path: artifacts/task-014

      - name: Download upgrade validation report
        uses: actions/download-artifact@v4
        with:
          name: task014-upgrade-validation-report
          path: artifacts/task-014

      - name: Build final review pack
        run: pnpm exec tsx scripts/build-task014-review-pack.ts

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task014-validation-reports
          path: |
            artifacts/task-014/*.txt
            reports/CODEX-TASK-014-COMPLETION.md
            task-014-review-summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload final review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task014-final-review-pack
          path: task-014-final-review-pack.zip
          if-no-files-found: error
          retention-days: 14
