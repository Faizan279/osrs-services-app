name: Task 011 validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/task-011-custom-account-build
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "3306"
  DATABASE_USER: osrs
  DATABASE_PASSWORD: task011-app-password
  DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
  AUTH_SECRET: task011-ci-auth-secret-at-least-32-characters
  ELIGIBILITY_HMAC_SECRET: task011-ci-eligibility-secret-at-least-32-characters
  ADMIN_SEED_EMAIL: task011-admin@example.test
  ADMIN_SEED_PASSWORD: Task011-CI-Admin-Password-Only
  ADMIN_SEED_NAME: Task 011 CI Admin
  ADMIN_SEED_RESET_PASSWORD: "false"
  TASK014_CUSTOMER_TEST_PASSWORD: Task014-CI-Customer-Password-Only
  CUSTOMER_SESSION_COOKIE: osrs_customer_session
  CUSTOM_BUILD_PRIVATE_ATTACHMENT_ROOT: /tmp/osrs-services-task011-private
  RSN_DEVELOPMENT_FIXTURE: "true"
  CI: "true"

jobs:
  task011-validation:
    name: task011-validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_NAME: osrs_services
      DATABASE_URL: mysql://osrs:task011-app-password@127.0.0.1:3306/osrs_services
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: task011-root-password
          MYSQL_DATABASE: osrs_services
          MYSQL_USER: osrs
          MYSQL_PASSWORD: task011-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uosrs -ptask011-app-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prisma format
        run: pnpm exec prisma format

      - name: Verify Prisma format did not change tracked files
        run: git diff --exit-code

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply fresh migrations
        run: pnpm db:migrate

      - name: Seed fresh database
        run: pnpm db:seed

      - name: Write fresh database validation report
        run: pnpm exec tsx scripts/validate-task011-fresh-db.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Seed tests
        run: pnpm test:seed

      - name: Format check
        run: pnpm format:check

      - name: Build
        env:
          RSN_DEVELOPMENT_FIXTURE: "false"
        run: pnpm build

      - name: E2E tests
        env:
          PLAYWRIGHT_USE_DEV_SERVER: "true"
          RSN_DEVELOPMENT_FIXTURE: "true"
        run: pnpm test:e2e

      - name: Capture Task 011 screenshots
        env:
          RSN_DEVELOPMENT_FIXTURE: "false"
        run: |
          pnpm build
          pnpm start > next-task011-screenshots.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat next-task011-screenshots.log
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          pnpm screenshots:task011

      - name: Verify Task 011 screenshots
        run: pnpm exec tsx scripts/build-task011-review-pack.ts --verify-screenshots

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task011-playwright-results
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task011-screenshots
          path: artifacts/task-011/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload fresh validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task011-fresh-validation-report
          path: artifacts/task-011/task011-fresh-database-validation.txt
          if-no-files-found: ignore
          retention-days: 14

  task010-to-task011-upgrade:
    name: task010-to-task011-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_NAME: task011_existing_validation
      DATABASE_URL: mysql://osrs:task011-app-password@127.0.0.1:3306/task011_existing_validation
      TASK010_BASE_COMMIT: b20b5c58674681bee989e4363d2d47d2c0fe7d0b
      TASK011_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: task011-root-password
          MYSQL_DATABASE: task011_existing_validation
          MYSQL_USER: osrs
          MYSQL_PASSWORD: task011-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uosrs -ptask011-app-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout Task 011 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Check out Task 010 merge commit
        run: |
          git checkout "$TASK010_BASE_COMMIT"
          git show "$TASK011_HEAD_SHA:scripts/validate-task011-existing-db.ts" > scripts/validate-task011-existing-db.ts

      - name: Install Task 010 dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Task 010 Prisma client
        run: pnpm db:generate

      - name: Apply Task 001-010 migrations
        run: pnpm db:migrate

      - name: Seed Task 010 database
        run: pnpm db:seed

      - name: Snapshot Task 010 preservation markers
        run: pnpm exec tsx scripts/validate-task011-existing-db.ts snapshot

      - name: Check out Task 011 branch
        run: |
          rm -f scripts/validate-task011-existing-db.ts
          git checkout "$TASK011_HEAD_SHA"

      - name: Install Task 011 dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Task 011 Prisma client
        run: pnpm db:generate

      - name: Apply Task 011 migration
        run: pnpm db:migrate

      - name: Seed Task 011 database once
        run: pnpm db:seed

      - name: Create custom-build seed-preservation markers
        run: pnpm exec tsx scripts/validate-task011-existing-db.ts prepare-custom-build

      - name: Seed Task 011 database a second time
        run: pnpm db:seed

      - name: Verify Task 010 preservation and Task 011 additions
        run: pnpm exec tsx scripts/validate-task011-existing-db.ts verify

      - name: Upload upgrade validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task011-upgrade-validation-report
          path: artifacts/task-011/task010-to-task011-validation.txt
          if-no-files-found: ignore
          retention-days: 14

  task011-final-review-pack:
    name: task011-final-review-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - task011-validation
      - task010-to-task011-upgrade
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changed file manifest
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD > changed-files.txt

      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: task011-screenshots
          path: artifacts/task-011

      - name: Download fresh validation report
        uses: actions/download-artifact@v4
        with:
          name: task011-fresh-validation-report
          path: artifacts/task-011

      - name: Download upgrade validation report
        uses: actions/download-artifact@v4
        with:
          name: task011-upgrade-validation-report
          path: artifacts/task-011

      - name: Build final review pack
        run: pnpm exec tsx scripts/build-task011-review-pack.ts

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task011-validation-reports
          path: |
            artifacts/task-011/*.txt
            reports/CODEX-TASK-011-COMPLETION.md
            task-011-review-summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload final review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task011-final-review-pack
          path: task-011-final-review-pack.zip
          if-no-files-found: error
          retention-days: 14
